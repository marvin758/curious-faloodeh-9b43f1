<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#062950">
  <title>Thank You | ISL Distributors</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#031d38,#0a3d70);padding:24px}
    .thanks{width:min(100%,620px);padding:48px;border-radius:28px;background:#fff;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.28)}
    .thanks img{width:250px;margin:0 auto 22px}.thanks p{color:#617184}.thanks .button{margin-top:12px}
  </style>
</head>
<body>
  <main class="thanks">
    <img src="assets/isl-logo.png" alt="Island Supply Leaders Distributors logo">
    <p class="eyebrow">Message Received</p>
    <h1 style="font-size:clamp(2.3rem,7vw,4rem)">Thank you for contacting ISL.</h1>
    <p>Your enquiry has been submitted. A member of the Island Supply Leaders Distributors team will follow up using the contact information provided.</p>
    <a class="button button-primary" href="/">Return to the website</a>
  </main>
</body>
</html>
